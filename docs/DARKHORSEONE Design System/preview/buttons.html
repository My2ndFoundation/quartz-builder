<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      padding: 24px;
      background: white;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-family: var(--style-button-family);
      font-size: var(--style-button-size);
      font-weight: var(--style-button-weight);
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: var(--transition-fast);
      text-transform: uppercase;
    }
    
    .btn-primary {
      background-color: var(--color-primary);
      color: white;
    }
    
    .btn-primary:hover {
      background-color: var(--color-primary-light);
    }
    
    .btn-primary:active {
      background-color: var(--color-primary-dark);
    }
    
    .btn-secondary {
      background-color: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
    }
    
    .btn-secondary:hover {
      background-color: var(--color-primary);
      color: white;
    }
    
    .btn-ghost {
      background-color: transparent;
      color: var(--color-text-primary);
    }
    
    .btn-ghost:hover {
      background-color: var(--color-gray-100);
    }
    
    .btn-large {
      padding: 16px 32px;
      font-size: 18px;
    }
    
    .btn-small {
      padding: 8px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="button-group">
    <button class="btn btn-primary">Get Started</button>
    <button class="btn btn-secondary">Learn More</button>
    <button class="btn btn-ghost">Contact</button>
  </div>
  
  <div class="button-group">
    <button class="btn btn-primary btn-large">Large Primary</button>
    <button class="btn btn-primary btn-small">Small Primary</button>
  </div>
</body>
</html>
