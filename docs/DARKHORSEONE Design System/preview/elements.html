<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Elements</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      padding: 20px;
      background: var(--cream);
    }
    
    .element {
      margin-bottom: 20px;
    }
    
    .label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    
    /* Checker Pattern */
    .checker {
      height: 12px;
      background-image:
        linear-gradient(45deg, var(--green) 25%, transparent 25%, transparent 75%, var(--green) 75%),
        linear-gradient(45deg, var(--green) 25%, var(--cream-2) 25%, var(--cream-2) 75%, var(--green) 75%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
    }
    
    /* Eyebrow */
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--green);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
    
    /* Card */
    .card {
      background: var(--cream-2);
      border-top: 3px solid var(--green);
      padding: 16px;
      margin-top: 8px;
    }
    
    .card-title {
      font-family: var(--font-headings);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-bottom: 6px;
    }
    
    .card-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="element">
    <div class="label">Checker Pattern</div>
    <div class="checker"></div>
  </div>
  
  <div class="element">
    <div class="label">Eyebrow Label</div>
    <div class="eyebrow">Strategic Services</div>
  </div>
  
  <div class="element">
    <div class="label">Card Component</div>
    <div class="card">
      <div class="card-title">Business Strategy</div>
      <div class="card-text">Transform challenges into competitive advantages with data-driven planning.</div>
    </div>
  </div>
</body>
</html>
