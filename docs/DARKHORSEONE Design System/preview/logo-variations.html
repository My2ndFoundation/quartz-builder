<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Variations</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      padding: 24px;
      background: white;
    }
    
    .logo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .logo-card {
      border: 1px solid var(--color-border-light);
      border-radius: 4px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    
    .logo-card.dark {
      background-color: #094832;
    }
    
    .logo-card.light {
      background-color: #F8F9FA;
    }
    
    .logo-card img {
      max-width: 200px;
      height: auto;
    }
    
    .logo-label {
      margin-top: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    
    .logo-card.dark .logo-label {
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div class="logo-grid">
    <div class="logo-card dark">
      <img src="../assets/logo-color.svg" alt="DARKHORSEONE Logo">
      <div class="logo-label">Primary (On Dark)</div>
    </div>
    
    <div class="logo-card light">
      <img src="../assets/logo-black.svg" alt="DARKHORSEONE Logo">
      <div class="logo-label">Black (On Light)</div>
    </div>
  </div>
</body>
</html>
